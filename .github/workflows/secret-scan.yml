# Secret scanning — gitleaks over the commit history and the working tree.
#
# Deliberately has no `paths:` filter. Every other workflow in this repo scopes
# itself to the area it builds; a credential can land in any file, so this one
# runs on every push and every pull request regardless of what changed.
#
# Nothing here needs a secret, so it is safe on `pull_request` from forks:
# `GITHUB_TOKEN` stays read-only and the job neither pushes nor authenticates.
#
# Findings are always `--redact`ed. On a public repository both the Actions log
# and any uploaded artifact are world-readable, so a scanner that echoed the
# secret it just found would leak it a second time and more publicly than the
# commit did.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  # Rules improve and new detectors ship; re-scan the same history on a
  # schedule so a credential that today's rule set misses is still caught later.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by version *and* checksum: this step runs a downloaded binary, so an
  # unpinned release would be an unreviewed dependency with repo read access.
  # Checksum from gitleaks_8.28.0_checksums.txt in the upstream release.
  GITLEAKS_VERSION: '8.28.0'
  GITLEAKS_SHA256: 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'

jobs:
  scan:
    name: gitleaks (history + working tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # `gitleaks git` walks real commits. The default shallow clone would
          # scan a single commit and report a confident, meaningless pass.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl -sSfL --retry 3 --retry-delay 2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Split from the working-tree scan so a red check names which one failed:
      # a hit here is a credential already written into a commit (rotate it,
      # then decide about rewriting history), while a hit below is an uncommitted
      # file that can simply be removed.
      - name: Scan commit history
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml \
            --log-opts="--all --full-history" \
            --redact --no-banner --verbose \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-history.json" \
          || {
            echo "::error::gitleaks found a secret in the commit history. It is already published to everyone with repository access, so rotate the credential first — removing the commit does not un-disclose it. If this is a false positive, add the specific value to the allowlist in .gitleaks.toml."
            exit 1
          }

      - name: Scan working tree
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml \
            --redact --no-banner --verbose \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-tree.json" \
          || {
            echo "::error::gitleaks found a secret in the checked-out tree. If this is a false positive, add the specific value to the allowlist in .gitleaks.toml."
            exit 1
          }

      # Redacted above, so this carries locations and rule names but no secrets.
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-findings
          path: ${{ runner.temp }}/gitleaks-*.json
          if-no-files-found: ignore
          retention-days: 7
