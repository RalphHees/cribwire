{{- if .Values.podDisruptionBudget.enabled }}
{{- if and .Values.podDisruptionBudget.minAvailable .Values.podDisruptionBudget.maxUnavailable }}
{{- fail "cribwire-backend: set only one of podDisruptionBudget.minAvailable or podDisruptionBudget.maxUnavailable." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cribwire-backend.fullname" . }}
  labels:
    {{- include "cribwire-backend.labels" . | nindent 4 }}
spec:
  {{- with .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cribwire-backend.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
