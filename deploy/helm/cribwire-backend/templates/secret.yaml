{{- if .Values.secret.create }}
{{- if .Values.secret.existingSecret }}
{{- fail "cribwire-backend: set either secret.existingSecret or secret.create, not both." }}
{{- end }}
{{- if not .Values.secret.data.DATABASE_URL }}
{{- fail "cribwire-backend: secret.create=true requires secret.data.DATABASE_URL." }}
{{- end }}
# Chart-managed credentials. These values are stored in the Helm release
# secret as well, so this is a bootstrap path — move to secret.existingSecret
# (External Secrets / Sealed Secrets / Vault) for steady state.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cribwire-backend.fullname" . }}
  labels:
    {{- include "cribwire-backend.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    {{- include "cribwire-backend.bootstrapHookAnnotations" . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
