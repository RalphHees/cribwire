{{- if .Values.imagePullSecrets.create.enabled }}
{{- $r := .Values.imagePullSecrets.create }}
{{- $registry := required "imagePullSecrets.create.registry is required" $r.registry }}
{{- $username := required "imagePullSecrets.create.username is required (use a Harbor robot account, not a personal login)" $r.username }}
{{- $password := required "imagePullSecrets.create.password is required" $r.password }}
# Pull credential for the private Harbor project. Supply the robot account at
# deploy time (`--set-string`) — it must not live in a values file in git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cribwire-backend.imagePullSecretName" . }}
  labels:
    {{- include "cribwire-backend.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    {{- include "cribwire-backend.bootstrapHookAnnotations" . | nindent 4 }}
  {{- end }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ printf "{\"auths\":{%q:{\"username\":%q,\"password\":%q,\"auth\":%q}}}" $registry $username $password (printf "%s:%s" $username $password | b64enc) | quote }}
{{- end }}
