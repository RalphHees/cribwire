# CribWire — XcodeGen project spec.
#
# The .xcodeproj is generated, never committed: run `xcodegen generate` from this
# directory (see README.md). That keeps the project file out of merge conflicts
# and makes the build settings reviewable as text.
#
# Placeholders to replace before signing a real build:
#   DEVELOPMENT_TEAM, PRODUCT_BUNDLE_IDENTIFIER prefix, CRIBWIRE_API_BASE_URL.
#
# One app target, one bundle id: notification payload decryption lives in the
# app (CribWire/Features/Notifications), not in a Notification Service
# Extension. That removes the second bundle id, its provisioning profile and the
# app group the two binaries used to share.

name: CribWire

options:
  bundleIdPrefix: com.ralphhees.cribwire
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  # EN/NL (`docs/TASKS.md` Phase 4). Dutch is not an afterthought here — the app
  # is built and first used in the Netherlands.
  knownRegions: [en, nl, Base]
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38.0"
  xcodeVersion: "16.0"

# ---------------------------------------------------------------------------
# Shared build settings
# ---------------------------------------------------------------------------
settings:
  base:
    # Language mode, not toolchain version: SWIFT_VERSION only accepts 4.0/4.2/
    # 5.0/6.0. The project targets the Swift 5 language mode built with a
    # 5.10-or-newer toolchain (CI pins Xcode 16.4); `CribWireKit/Package.swift`
    # declares swift-tools-version 5.10 separately.
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Placeholder — set to the real Apple Developer team ID.
    DEVELOPMENT_TEAM: "NRV7K64R87"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    # Extract localizable strings into the String Catalog at build time, so a new
    # `Text("…")` shows up as an untranslated entry instead of silently shipping
    # English to Dutch users.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES

    # Default backend used by the Camera when it creates a pairing. The Viewer
    # always uses the URL carried in the scanned QR code, never this one.
    CRIBWIRE_API_BASE_URL: https://apicribwire.ralphhees.nl
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      # Must match what `PushNotificationCoordinator` registers with the backend
      # (`API.APNSEnvironment`): a token minted in one environment is rejected by
      # the other, and the backend picks the APNs host from what we send.
      CRIBWIRE_APS_ENVIRONMENT: development
    release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      CRIBWIRE_APS_ENVIRONMENT: production

# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------
packages:
  # Every piece of pure logic (crypto, protocol encoding, pairing state machine,
  # API client) lives here so it can also be tested with `swift test`.
  CribWireKit:
    path: CribWireKit

  # libwebrtc binary distribution. Wired up in Phase 0 so the dependency graph
  # and CI resolution are proven; no source file imports it until Phase 2
  # (docs/TASKS.md → Phase 2, StreamingEngine).
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: 120.0.0
    maxVersion: 200.0.0

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  CribWire:
    type: application
    platform: iOS
    sources:
      - path: CribWire
    dependencies:
      - package: CribWireKit
        product: CribWireKit
      - package: WebRTC
        product: WebRTC
      - target: CribWireWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphhees.cribwire.CribWire
        PRODUCT_NAME: CribWire
        # iPhone and iPad. An iPad is the natural Viewer — it sits on a
        # counter all day — so the layouts adapt by size class rather than
        # stretching a phone screen (`docs/TASKS.md` Phase 5).
        TARGETED_DEVICE_FAMILY: "1,2"
        # App icon ships in CribWire/Assets.xcassets; `actool` picks the set up
        # by name, so the icon set must stay named AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: CribWire/CribWire.entitlements
      properties:
        # Keys live in the app's own Keychain access group, so no app group and
        # no keychain-access-groups entitlement is needed.
        aps-environment: $(CRIBWIRE_APS_ENVIRONMENT)
    info:
      path: CribWire/Info.plist
      properties:
        CFBundleDisplayName: CribWire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad adds upside-down: a tablet propped in a stand is as likely to be
        # rotated 180° as any other way.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Night-first design language (docs/design/README.md).
        UIUserInterfaceStyle: Dark

        # --- Permission strings (ios-app.md §4) --------------------------
        NSCameraUsageDescription: >-
          CribWire uses the camera to stream your child's room to your paired
          device, and to scan the pairing QR code. Video never leaves your
          devices unencrypted.
        NSMicrophoneUsageDescription: >-
          CribWire uses the microphone to stream room audio and to detect noise
          on this device. Audio is end-to-end encrypted and is never sent to a
          server in the clear.
        NSLocalNetworkUsageDescription: >-
          CribWire connects directly to your paired device over your local
          network, so video stays in your home whenever possible.
        # Required since iOS 14: an undeclared Bonjour type is not merely
        # blocked, it fails silently, which looks exactly like "no cameras
        # found" (`docs/TASKS.md` Phase 5, local-network-only mode).
        NSBonjourServices:
          - _cribwire._tcp
        # Add-only: the Viewer's snapshot button writes one image and CribWire
        # never reads the library back.
        NSPhotoLibraryAddUsageDescription: >-
          CribWire saves the snapshots you take of the live view to your photo
          library. It never reads your existing photos.
        # Required by MusicKit before `MusicAuthorization.request()` will do
        # anything: without it the request returns denied with no prompt, which
        # looks exactly like a user refusing. Only the Camera ever asks — see
        # `NurseryController.requestMusicAuthorization`.
        NSAppleMusicUsageDescription: >-
          CribWire plays music through this phone's speaker so you can soothe
          your child from the paired device. It reads your playlists to offer
          them, and never sends your library or listening history to a server.

        # Live Activity support (`docs/TASKS.md` Phase 5).
        NSSupportsLiveActivities: true

        # Audio only. `voip` would require CallKit, which CribWire does not use
        # (ios-app.md §4).
        UIBackgroundModes:
          - audio

        # --- Runtime configuration ---------------------------------------
        CribWireAPIBaseURL: $(CRIBWIRE_API_BASE_URL)
        # TIDAL client id from developer.tidal.com. Left as an unsubstituted
        # placeholder on purpose: `TidalConfiguration` treats `$(…)` and empty
        # as "not configured", so a default build simply does not offer TIDAL
        # rather than offering a service it cannot play. See the header of
        # `TidalMusicProvider.swift` for what completing it involves.
        CribWireTidalClientID: $(CRIBWIRE_TIDAL_CLIENT_ID)

    scheme:
      testTargets:
        - CribWireTests
      gatherCoverageData: true
      coverageTargets:
        - CribWire

  # ---------------------------------------------------------------------------
  # Live Activity widget extension.
  #
  # A second bundle id, reluctantly: ActivityKit renders in a separate process, so
  # unlike the notification-decryption case there is no way to keep this in the
  # app. It shares no Keychain group and holds no key — the payload it draws is
  # already non-secret by construction (see CribWireActivityAttributes).
  #
  # This bundle holds *only* an ActivityConfiguration. It deliberately ships no
  # Home Screen or Lock Screen widget, which is why it must not be launched with
  # Xcode's widget Run action — see the `CribWireWidgets` scheme below.
  # ---------------------------------------------------------------------------
  CribWireWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CribWireWidgets
      # The attributes type is shared by reference, never copied: two copies that
      # drift apart fail at runtime with no compiler warning.
      - path: CribWire/Features/LiveActivity/CribWireActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphhees.cribwire.CribWire.Widgets
        PRODUCT_NAME: CribWireWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Higher than the app's 16.0 on purpose. ActivityConfiguration is 16.1+,
        # so on a 16.0 device this extension would install and then register zero
        # widgets — an empty WidgetBundle, which WidgetKit reports as "failed to
        # get descriptors" rather than as anything diagnosable. Declaring 16.1
        # means the system simply does not load it there.
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
    # One source of truth for the extension's Info.plist, matching how the app
    # target is set up: XcodeGen writes this file, and it is gitignored rather
    # than committed. GENERATE_INFOPLIST_FILE is deliberately absent — pairing it
    # with an `info:` block gives the NSExtension dictionary two owners, and that
    # dictionary is the whole of what marks this bundle as a widget extension.
    info:
      path: CribWireWidgets/Info.plist
      properties:
        CFBundleDisplayName: CribWire
        # Must track the host app exactly. An embedded extension whose version
        # differs from its container is rejected at install and at upload, and
        # the install-side rejection arrives as a SpringBoard "request denied"
        # with nothing in it that names the version as the cause. XcodeGen's
        # defaults are a flat 1.0/1, so both keys are stated here.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CribWireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CribWireTests
      # The one normative copy of the cross-implementation vectors. Referenced,
      # never duplicated (shared/protocol.md).
      - path: ../shared/test-vectors/cribwire-v1.json
        buildPhase: resources
    dependencies:
      - target: CribWire
      - package: CribWireKit
        product: CribWireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ralphhees.cribwire.CribWireTests
        GENERATE_INFOPLIST_FILE: YES

# ---------------------------------------------------------------------------
# Schemes
#
# The CribWire scheme is generated from that target's `scheme:` block above.
# This section exists for CribWireWidgets alone.
# ---------------------------------------------------------------------------
schemes:

  # Xcode autocreates one scheme per target, and the autocreated widget-extension
  # scheme runs by asking SpringBoard to *place a widget* for the extension's
  # bundle id. CribWireWidgets ships only a Live Activity, so WidgetKit has no
  # widget descriptors to hand back and the launch dies with
  #
  #   SBAvocadoDebuggingControllerErrorDomain Code=1
  #   "Failed to get descriptors for extensionBundleID
  #    (com.ralphhees.cribwire.CribWire.Widgets)"
  #
  # which surfaces as the far less helpful "The request to open
  # com.apple.springboard failed". Checking in a shared scheme of the same name
  # takes precedence over the autocreated one and launches the host app instead:
  # start a Viewer session and the Live Activity appears the way it does for a
  # real user. Breakpoints in CribWireLiveActivity.swift need the extension's own
  # process — Debug ▸ Attach to Process ▸ CribWireWidgets, once it is drawing.
  CribWireWidgets:
    build:
      targets:
        CribWireWidgets: all
        CribWire: all
    run:
      config: Debug
      executable: CribWire
      askForAppToLaunch: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
