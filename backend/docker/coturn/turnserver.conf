# coturn for local development — backend.md §4.
#
# `use-auth-secret` is the REST-API credential mode: coturn stores no users and
# recomputes HMAC-SHA1(static-auth-secret, "<expiry>:<pairingId>") for every
# credential the API issued. The API must be configured with the same secret in
# TURN_SHARED_SECRET.
#
# This secret is a development placeholder. Production takes it from the
# secrets manager and never from a file in the repository.

listening-port=3478
tls-listening-port=5349

fingerprint
use-auth-secret
static-auth-secret=dev-turn-secret
realm=kidscam.local

# Relay range from backend.md §4.
min-port=49152
max-port=65535

# Per-allocation bandwidth cap: ~2 Mbps, expressed in bytes per second.
max-bps=250000

# TURN only ever forwards SRTP ciphertext, but it should still not be usable as
# a proxy into the deployment's own network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1

no-tlsv1
no-tlsv1_1
no-cli
no-software-attribute
stale-nonce=600

# Logs carry no payloads; keep them on stdout for the container runtime.
log-file=stdout
simple-log
